<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
  <title id="title">Nix Home Machines logical structure</title>
  <desc id="desc">Flake inputs and inventory feed flake.nix. System configurations and standalone Home Manager configurations are separate outputs. Neo uses nix-darwin and apoc uses NixOS. Both use shared Home Manager workstation modules. Just recipes orchestrate separate system and home activations.</desc>
  <style>
    :root { --fg: #2d3142; --muted: #4f5d75; --border: #bfc0c0; --accent: #bf4520; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f5; --muted: #bfc0c0; --border: #949eb2; --accent: #f08a59; } }
    text { font-family: system-ui, sans-serif; fill: var(--fg); }
    .eyebrow { font-size: 12px; letter-spacing: 1.5px; fill: var(--muted); }
    .heading { font-size: 18px; font-weight: 650; }
    .detail { font-size: 14px; fill: var(--muted); }
    .box { fill: none; stroke: var(--border); }
    .flow { fill: none; stroke: var(--muted); stroke-width: 1.4; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--muted)" stroke-width="1.2"/></marker></defs>
  <text x="32" y="32" class="eyebrow">NIX HOME MACHINES / CONFIGURATION MAP</text>
  <text x="32" y="68" font-size="28" font-weight="650">One repository. Two configuration layers.</text>
  <text x="32" y="96" class="detail">Explicit imports select features; directories do not enable modules automatically.</text>

  <path class="flow" d="M276 166 H320"/>
  <path class="flow" d="M684 166 H640"/>
  <path class="flow" d="M480 208 V228 Q480 236 472 236 H264 Q256 236 256 244 V272"/>
  <path class="flow" d="M480 208 V228 Q480 236 488 236 H696 Q704 236 704 244 V272"/>

  <rect x="32" y="128" width="244" height="80" rx="4" class="box"/>
  <text x="48" y="158" class="heading">Pinned inputs</text>
  <text x="48" y="184" class="detail">flake.lock · nixpkgs · modules</text>
  <rect x="320" y="128" width="320" height="80" rx="4" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="340" y="158" class="heading" style="fill:var(--accent)">flake.nix</text>
  <text x="340" y="184" class="detail">Constructs system + home outputs</text>
  <rect x="684" y="128" width="244" height="80" rx="4" class="box"/>
  <text x="700" y="158" class="heading">Machine identity</text>
  <text x="700" y="184" class="detail">inventory.json · users/</text>

  <rect x="32" y="272" width="432" height="260" rx="4" class="box"/>
  <text x="52" y="304" class="eyebrow">SYSTEM CONFIGURATION</text>
  <text x="52" y="340" class="heading">hosts/&lt;host&gt;/configuration.nix</text>
  <text x="52" y="368" class="detail">OS services · system packages · hardware</text>
  <path d="M52 388 H444" stroke="var(--border)"/>
  <text x="52" y="420" class="heading">neo · nix-darwin</text>
  <text x="52" y="444" class="detail">macOS defaults + declared Homebrew apps</text>
  <text x="52" y="480" class="heading">apoc · NixOS VM</text>
  <text x="52" y="504" class="detail">Linux system + VM-specific configuration</text>

  <rect x="496" y="272" width="432" height="260" rx="4" class="box"/>
  <text x="516" y="304" class="eyebrow">USER CONFIGURATION · STANDALONE</text>
  <text x="516" y="340" class="heading">home/fs/&lt;host&gt;.nix</text>
  <text x="516" y="368" class="detail">Host-specific user entry point</text>
  <path d="M516 388 H908" stroke="var(--border)"/>
  <text x="516" y="420" class="heading">home/profiles/workstation.nix</text>
  <text x="516" y="444" class="detail">Shared shells · Git · terminal · AI tooling</text>
  <text x="516" y="480" class="heading">home/modules/</text>
  <text x="516" y="504" class="detail">Reusable user features + files/ assets</text>

  <path d="M32 564 H928" stroke="var(--border)"/>
  <text x="32" y="596" class="heading">Deployment: justfile + tasks/</text>
  <text x="32" y="624" class="detail">System switch, then a separate Home Manager switch — not an atomic activation.</text>
  <text x="32" y="652" class="detail">Shared system settings: modules/ · Package customization: overlays/ · Operational guides: docs/</text>
</svg>

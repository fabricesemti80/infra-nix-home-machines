# Inspired by https://github.com/TechDufus/dotfiles/tree/main/modules/herdr
# Keep Herdr's default prefix (Ctrl+B) and pane bindings; tmux uses Ctrl+Q.
onboarding = false

[theme]
name = "dracula"
auto_switch = false

[keys]
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "gh dash"
description = "Repository GitHub dashboard"
width = "90%"
height = "90%"

[ui]
show_agent_labels_on_pane_borders = true
pane_gaps = false
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
window_title = "{workspace} — {tab} · {hostname}"
status_indicators = "symbols"
agent_panel_sort = "priority"
sidebar_width = 38
sidebar_min_width = 26
sidebar_max_width = 48
sidebar_collapsed_mode = "compact"

[ui.toast]
delivery = "terminal"
